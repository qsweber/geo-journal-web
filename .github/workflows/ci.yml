name: CI Workflow

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
        description: "CDK stack environment suffix (dev or production)"
      environment:
        required: true
        type: string
        description: "GitHub environment name (dev or production)"
      run-deploy:
        required: false
        type: boolean
        default: true
        description: "Whether to run deployment step"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npx prettier . --check
      - run: npx eslint . --ext .ts,.tsx

  cdk-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: cd cdk && npm ci
      - run: cd cdk && npx tsc --noEmit
      - run: cd cdk && npx cdk synth --all

  infra:
    runs-on: ubuntu-latest
    needs: [cdk-checks]
    outputs:
      distributionId: ${{ steps.cdk-outputs.outputs.distributionId }}
      s3BucketUri: ${{ steps.cdk-outputs.outputs.s3BucketUri }}
      userPoolId: ${{ steps.cdk-outputs.outputs.userPoolId }}
      userPoolClientId: ${{ steps.cdk-outputs.outputs.userPoolClientId }}
      apiUrl: ${{ steps.cdk-outputs.outputs.apiUrl }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: cd cdk && npm ci
      - name: Deploy infrastructure
        run: cd cdk && npx cdk deploy geo-journal-web-${{ inputs.stack }} --require-approval never
      - id: cdk-outputs
        run: |
          STACK_NAME=geo-journal-web-${{ inputs.stack }}
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          S3_BUCKET_URI=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='S3BucketUri'].OutputValue" --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "distributionId=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "s3BucketUri=$S3_BUCKET_URI" >> $GITHUB_OUTPUT
          echo "userPoolId=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "userPoolClientId=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "apiUrl=$API_URL" >> $GITHUB_OUTPUT
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-west-2"

  build:
    runs-on: ubuntu-latest
    needs: [test, infra]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ needs.infra.outputs.userPoolId }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ needs.infra.outputs.userPoolClientId }}
          NEXT_PUBLIC_API_URL: ${{ needs.infra.outputs.apiUrl }}
          NEXT_PUBLIC_COGNITO_REGION: us-west-2
      - run: zip -r build.zip out/*
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.stack }}
          path: build.zip

  deploy:
    runs-on: ubuntu-latest
    needs: [test, infra, build]
    if: ${{ inputs.run-deploy }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ inputs.stack }}
      - run: unzip build.zip
      - run: pip install awscli
      - run: aws s3 sync --acl public-read --delete ./out ${{ needs.infra.outputs.s3BucketUri }}
      - run: aws configure set preview.cloudfront true
      - run: aws cloudfront create-invalidation --distribution-id ${{ needs.infra.outputs.distributionId }} --paths '/*'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
